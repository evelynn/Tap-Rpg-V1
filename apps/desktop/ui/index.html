<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>텝 기본 창</title>
  <style>
    body { margin: 16px; background: #d9d4cc; color: #2b2233; font: 13px system-ui, "Malgun Gothic", sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #15121a; color: #f4efe6; } }
    /* 기본 창 768 × 64(100% 기준, D75). --u는 개발용 확대(?scale=, 기본 1) */
    #win { position: relative; width: calc(768px * var(--u, 1)); height: calc(64px * var(--u, 1)); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
    /* 캔버스 CSS 크기 = 장치 크기 / dpr(main.ts가 넣는다). 브라우저가 다시 늘이지 않게 pixelated도 둔다 */
    #art { position: absolute; left: 0; bottom: 0; display: block; image-rendering: pixelated; }
    /* 글자 칸 x 496~767(272). 작은 글자 2줄: 1줄 y 17 이름·상태 + 오른쪽 아이콘·표식(84), 2줄 y 34 한 줄 기록(03 §2.2) */
    #col { position: absolute; top: 0; right: 0; width: calc(272px * var(--u)); height: 100%;
      font: calc(11px * var(--u)) / calc(13px * var(--u)) system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #2b2233; --paper: 244, 239, 230; }
    #col.dark { color: #f4efe6; --paper: 42, 37, 48; }
    /* 판: 불투명도 88%, 왼쪽 5는 풍경에서 넘어오는 그라데이션 */
    #col .plate { position: absolute; inset: 0; background: linear-gradient(to right, rgba(var(--paper), 0), rgba(var(--paper), .88) calc(5px * var(--u))); }
    #col .status, #col .icons, #col .record { position: absolute; height: calc(13px * var(--u)); white-space: nowrap; }
    #col .status { left: calc(5px * var(--u)); width: calc(175px * var(--u)); top: calc(17px * var(--u)); font-weight: bold; }
    #col .icons { right: calc(5px * var(--u)); width: calc(84px * var(--u)); top: calc(17px * var(--u)); display: flex; align-items: center; gap: calc(2px * var(--u)); }
    #col .ico { width: calc(12px * var(--u)); height: calc(12px * var(--u)); flex: none; }
    #col .mark, #col .attitude { flex: none; width: calc(12px * var(--u)); height: calc(12px * var(--u)); box-sizing: border-box; border-radius: calc(2px * var(--u));
      font-size: calc(9px * var(--u)); line-height: calc(12px * var(--u)); font-weight: bold; text-align: center; }
    #col .mark { margin-left: calc(2px * var(--u)); } /* 아이콘과 표식 사이 4 = gap 2 + 2 */
    #col .mark.none { visibility: hidden; }
    #col .mark.choice { background: #7b5cc4; color: #fff; }
    #col .mark.succession { background: #a8894a; color: #fff; }
    #col .attitude { border: 1px solid currentColor; line-height: calc(12px * var(--u) - 2px); font-weight: normal; }
    #col .record { left: calc(5px * var(--u)); right: calc(5px * var(--u)); top: calc(34px * var(--u)); }
    #win canvas, #col .status, #col .icons, #col .record { cursor: pointer; }
    /* 상세 창 480 × 560(03 §5). 시제품에서는 개발용 단추 아래에 둔다. 본문 13, 최소 12, 소제목 15 굵게, 안쪽 여백 16 */
    #menu { position: absolute; z-index: 20; min-width: 132px; padding: 4px 0; background: #fbf8f2; color: #2b2233; border: 1px solid #8a8a8a; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); font: 12px system-ui, sans-serif; }
    #menu[hidden] { display: none; }
    #menu button { display: block; width: 100%; text-align: left; padding: 3px 10px; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    #menu button:hover, #menu button:focus { background: #5a7fa8; color: #fff; outline: none; }
    #menu hr { margin: 4px 0; border: 0; border-top: 1px solid rgba(128, 128, 128, .4); }
    @media (prefers-color-scheme: dark) { #menu { background: #2a2530; color: #f4efe6; } }
    #detail { margin-top: 12px; width: 480px; height: 560px; display: flex; flex-direction: column; z-index: 10;
      background: #f4efe6; color: #2b2233; font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); outline: none; }
    #detail[hidden] { display: none; }
    #detail { word-break: keep-all; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) { #detail { background: #2a2530; color: #f4efe6; } }
    #detail button { font: inherit; font-size: 12px; padding: 1px 8px; border: 1px solid #8a8a8a; background: transparent; color: inherit; border-radius: 3px; cursor: pointer; }
    #detail button.on { background: #5a7fa8; border-color: #5a7fa8; color: #fff; }
    #detail button:disabled { opacity: .45; cursor: default; }
    #detail .d-head { height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; }
    #detail .d-tabs { height: 32px; display: flex; }
    #detail .d-tabs button { flex: 1; border-radius: 0; border-width: 0 0 2px; font-size: 13px; }
    #detail .d-tabs button.on { background: transparent; color: inherit; border-color: #5a7fa8; font-weight: bold; }
    #detail .d-body { flex: 1; overflow-y: auto; padding: 8px 16px; }
    #detail .d-foot { height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; opacity: .8; }
    #detail .d-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
    #detail .d-group { margin-top: 8px; font-weight: bold; font-size: 12px; opacity: .75; }
    #detail .d-row { padding: 2px 0; }
    #detail .d-row.more { cursor: pointer; }
    #detail .d-caret { float: right; opacity: .6; }
    #detail .d-sub { padding: 0 0 2px 16px; font-size: 12px; opacity: .85; }
    #detail .d-tag, #detail .d-strong { font-weight: bold; }
    #detail .d-strong { font-size: 15px; }
    #detail .d-dim { opacity: .65; font-size: 12px; }
    #detail .d-sec { padding: 8px 0; border-bottom: 1px solid rgba(128, 128, 128, .3); }
    #detail .d-cols { display: flex; gap: 32px; }
    #detail .d-badge { font-size: 12px; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }
    #detail .d-badge.neg { border-style: dashed; }
    #detail .d-grade { font-weight: bold; }
    #detail .d-acts { display: flex; gap: 6px; padding: 2px 0 6px 16px; }
    #detail .d-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    #detail .d-label { width: 110px; flex: none; white-space: pre; }
    #detail .d-seg { display: flex; gap: 2px; flex-wrap: wrap; }
    #detail .d-confirm { margin: 4px 0 4px 16px; padding: 8px; border: 1px solid #d9534f; }
    #detail .d-tree { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 0; }
    #detail .d-tree-node { border: 2px solid currentColor; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
    #detail .d-tree-node.dashed { border-style: dashed; }
    #detail .d-tree-link { padding-left: 20px; opacity: .6; line-height: 1; }
    #detail progress { width: 120px; vertical-align: middle; }
    #controls { margin-top: 12px; display: flex; gap: 6px; }
    #info { margin-top: 8px; }
  </style>
</head>
<body>
  <div id="win" aria-label="텝 기본 창">
    <canvas id="art"></canvas>
    <div id="col"></div>
  </div>
  <div id="controls"></div>
  <div id="info">불러오는 중…</div>
  <div id="menu"></div>
  <div id="detail" role="dialog" aria-label="상세 창"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
