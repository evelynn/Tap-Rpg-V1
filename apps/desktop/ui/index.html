<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>텝 기본 창</title>
  <style>
    body { margin: 16px; background: #d9d4cc; color: #2b2233; font: 13px system-ui, "Malgun Gothic", sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #15121a; color: #f4efe6; } }
    /* 기본 창 768 × 64(100% 기준, D75). --u는 개발용 확대(?scale=, 기본 1) */
    #win { position: relative; width: calc(768px * var(--u, 1)); height: calc(64px * var(--u, 1)); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
    /* 캔버스 CSS 크기 = 장치 크기 / dpr(main.ts가 넣는다). 브라우저가 다시 늘이지 않게 pixelated도 둔다 */
    #art { position: absolute; left: 0; bottom: 0; display: block; image-rendering: pixelated; }
    #col { position: absolute; top: 0; right: 0; width: calc(192px * var(--u)); height: 100%;
      font: calc(11px * var(--u)) / calc(13px * var(--u)) system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #2b2233; --paper: 244, 239, 230; }
    #col.dark { color: #f4efe6; --paper: 42, 37, 48; }
    /* 판: 불투명도 88%, 왼쪽 6은 풍경에서 넘어오는 그라데이션 */
    #col .plate { position: absolute; inset: 0; background: linear-gradient(to right, rgba(var(--paper), 0), rgba(var(--paper), .88) calc(6px * var(--u))); }
    #col .status, #col .icons, #col .record { position: absolute; left: calc(6px * var(--u)); right: calc(4px * var(--u)); white-space: nowrap; }
    #col .status { top: calc(2px * var(--u)); font-weight: bold; }
    #col .icons { top: calc(17px * var(--u)); height: calc(12px * var(--u)); display: flex; align-items: center; gap: calc(3px * var(--u)); }
    #col .ico { width: calc(12px * var(--u)); height: calc(12px * var(--u)); flex: none; }
    #col .gap { flex: 1; }
    #col .mark, #col .attitude { flex: none; width: calc(12px * var(--u)); height: calc(12px * var(--u)); box-sizing: border-box; border-radius: calc(2px * var(--u));
      font-size: calc(9px * var(--u)); line-height: calc(12px * var(--u)); font-weight: bold; text-align: center; }
    #col .mark.choice { background: #7b5cc4; color: #fff; }
    #col .mark.succession { background: #a8894a; color: #fff; }
    #col .attitude { border: 1px solid currentColor; line-height: calc(12px * var(--u) - 2px); font-weight: normal; }
    #col .record { top: calc(32px * var(--u)); }
    #controls { margin-top: 12px; display: flex; gap: 6px; }
    #info { margin-top: 8px; }
  </style>
</head>
<body>
  <div id="win" aria-label="텝 기본 창">
    <canvas id="art"></canvas>
    <div id="col"></div>
  </div>
  <div id="controls"></div>
  <div id="info">불러오는 중…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
