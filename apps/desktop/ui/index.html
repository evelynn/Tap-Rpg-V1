<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>텝 기본 창</title>
  <style>
    body { margin: 16px; background: #d9d4cc; color: #2b2233; font: 13px system-ui, "Malgun Gothic", sans-serif; }
    html.dark body { background: #15121a; color: #f4efe6; }
    /* 기본 창 768 × 128(100% 기준, D75·D84). --u는 화면 배율 1·2·3(D81, main.ts가 넣는다) */
    /* 기본 창 너비 --w는 528~1536(D82, main.ts가 넣는다). 기록 띠·말풍선은 기본 창 바로 위(03 §2.7) */
    #app { display: inline-block; }
    #stack { position: relative; width: calc(var(--w, 768) * 1px * var(--u, 1)); --paper: 244, 239, 230; color: #2b2233;
      font: calc(11px * var(--u, 1)) / calc(13px * var(--u, 1)) system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    #stack.nostrip { padding-top: calc(64px * var(--u, 1)); } /* 띠가 꺼져도 말풍선 자리를 남긴다 */
    #strip { box-sizing: border-box; height: calc(72px * var(--u, 1)); padding: calc(4px * var(--u, 1)) calc(5px * var(--u, 1)); overflow: hidden;
      background: rgba(var(--paper), .88); cursor: pointer; word-break: keep-all; overflow-wrap: anywhere; }
    #strip[hidden] { display: none; }
    #strip .row { white-space: nowrap; }
    #strip .detail { opacity: .7; }
    #bubble { position: absolute; z-index: 6; bottom: calc(134px * var(--u, 1)); left: calc((var(--cx, 208) - 20) * 1px * var(--u, 1));
      max-width: calc(300px * var(--u, 1)); box-sizing: border-box; padding: calc(4px * var(--u, 1)) calc(7px * var(--u, 1));
      background: rgb(var(--paper)); border: 1px solid rgba(0, 0, 0, .35); border-radius: calc(6px * var(--u, 1));
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3); line-height: calc(14px * var(--u, 1)); cursor: pointer; word-break: keep-all; overflow-wrap: anywhere; }
    #bubble[hidden] { display: none; }
    #bubble .line { font-weight: bold; }
    #bubble .detail { opacity: .8; }
    #bubble::after { content: ''; position: absolute; left: calc(16px * var(--u, 1)); bottom: calc(-6px * var(--u, 1)); border: calc(6px * var(--u, 1)) solid transparent;
      border-bottom: 0; border-top-color: rgb(var(--paper)); }
    html.dark #stack { --paper: 42, 37, 48; color: #f4efe6; }
    #win { position: relative; width: 100%; height: calc(128px * var(--u, 1)); } /* 배경 띠 위는 투명(D91) — 창 그림자를 두지 않는다 */
    #grip { position: absolute; z-index: 5; top: 0; right: -3px; width: 6px; height: 100%; cursor: ew-resize; }
    /* 캔버스 CSS 크기 = 장치 크기 / dpr(main.ts가 넣는다). 브라우저가 다시 늘이지 않게 pixelated도 둔다 */
    #art { position: absolute; left: 0; bottom: 0; display: block; image-rendering: pixelated; }
    /* 상태 칩(D91, 03 §2.2): 풍경 오른쪽 아래(여백 4)에 글자 폭만큼의 반투명 둥근 칩. 안쪽 여백 5·3, 글자 최대 262.
       작은 글자 2줄: 1줄 상태 기호·이름·상태 + 아이콘·표식 하나, 2줄 한 줄 기록 */
    #col { --s: calc(var(--u, 1) * var(--t, 1)); position: absolute; z-index: 1; right: calc(4px * var(--u, 1)); bottom: calc(4px * var(--u, 1));
      box-sizing: border-box; max-width: calc(272px * var(--s)); padding: calc(3px * var(--s)) calc(5px * var(--s)); border-radius: calc(6px * var(--s));
      font: calc(11px * var(--s)) / calc(13px * var(--s)) system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #2b2233; --paper: 244, 239, 230; background: rgba(var(--paper), .82); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); white-space: nowrap; }
    #col.dark { color: #f4efe6; --paper: 42, 37, 48; }
    #col .row1 { display: flex; align-items: center; gap: calc(3px * var(--s)); }
    #col .status, #col .icons, #col .record { height: calc(13px * var(--s)); }
    #col .status { max-width: calc(175px * var(--s)); font-weight: bold; }
    #col .icons { margin-left: auto; display: flex; align-items: center; gap: calc(2px * var(--s)); }
    #col .ico { width: calc(12px * var(--s)); height: calc(12px * var(--s)); flex: none; }
    #col .mark, #col .attitude { flex: none; width: calc(12px * var(--s)); height: calc(12px * var(--s)); box-sizing: border-box; border-radius: calc(2px * var(--s));
      font-size: calc(9px * var(--s)); line-height: calc(12px * var(--s)); font-weight: bold; text-align: center; }
    #col .ico + .mark, #col .ico + .attitude { margin-left: calc(2px * var(--s)); } /* 아이콘과 표식 사이 4 = gap 2 + 2 */
    /* v07 12 × 12 그림(ui_icons_12): 화면 배율(정수)로만 키운다 */
    #col .bmp, #col .sico { background: url(sprites/ui_icons_12.png) no-repeat; background-size: calc(72px * var(--u, 1)) calc(36px * var(--u, 1));
      image-rendering: pixelated; width: calc(12px * var(--u, 1)); height: calc(12px * var(--u, 1)); border: 0; border-radius: 0; }
    #col .sico { display: inline-block; vertical-align: calc(-2px * var(--s)); margin-right: calc(3px * var(--s)); }
    #col .sico[hidden] { display: none; }
    #col .attitude { border: 1px solid currentColor; line-height: calc(12px * var(--s) - 2px); font-weight: normal; }
    #col .record { max-width: calc(262px * var(--s)); overflow: hidden; text-overflow: ellipsis; }
    #col .record:empty { display: none; }
    #win canvas, #col .status, #col .icons, #col .record { cursor: pointer; }
    /* 상세 창 480 × 560(03 §5). 시제품에서는 개발용 단추 아래에 둔다. 본문 13, 최소 12, 소제목 15 굵게, 안쪽 여백 16 */
    /* 판 공통 스타일(D91, 03 §5.1.1): 메뉴·상세 창·선택·계승·설정·요약·첫 실행·책이 같은 토큰을 쓴다 */
    html { --p-bg: #f4efe6; --p-fg: #2b2233; --p-line: rgba(43, 34, 51, .2); --p-sep: rgba(43, 34, 51, .12); --p-soft: rgba(43, 34, 51, .05);
      --p-accent: #4f769f; --p-accent-soft: rgba(79, 118, 159, .15); --p-on: #fff; --p-warn: #c9453a; --p-gold: #b98a24;
      --p-r: 10px; --p-r2: 6px; --p-pad: 16px; --p-gap: 8px; --p-fs: 13px; --p-fs-sub: 12px; --p-shadow: 0 3px 12px rgba(0, 0, 0, .24); }
    html.dark { --p-bg: #2a2530; --p-fg: #f4efe6; --p-line: rgba(244, 239, 230, .22); --p-sep: rgba(244, 239, 230, .12); --p-soft: rgba(244, 239, 230, .06);
      --p-accent: #86a9d0; --p-accent-soft: rgba(134, 169, 208, .2); --p-on: #1c1822; --p-warn: #e0776d; --p-gold: #d8b45a; }
    #menu { position: absolute; z-index: 20; min-width: 132px; box-sizing: border-box; padding: 4px; background: var(--p-bg); color: var(--p-fg);
      border: 1px solid var(--p-line); border-radius: var(--p-r); box-shadow: var(--p-shadow); font: var(--p-fs-sub) system-ui, "Malgun Gothic", sans-serif; }
    #menu[hidden] { display: none; }
    #menu button { display: block; width: 100%; text-align: left; padding: 4px 10px; border: 0; border-radius: var(--p-r2); background: transparent; color: inherit; font: inherit; cursor: pointer; }
    #menu button:hover, #menu button:focus { background: var(--p-accent-soft); outline: none; }
    #menu button[aria-checked=true] { font-weight: bold; }
    #menu hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--p-sep); }
    .dwin { margin-top: 12px; width: 480px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 10; overflow: hidden;
      background: var(--p-bg); color: var(--p-fg); border: 1px solid var(--p-line); border-radius: var(--p-r);
      font: var(--p-fs)/1.5 system-ui, "Malgun Gothic", sans-serif; box-shadow: var(--p-shadow); outline: none; }
    .dwin[hidden] { display: none; }
    #choice { width: 440px; height: 420px; }
    #summary { width: 400px; height: 300px; }
    #choice .d-foot, #succession .d-foot { height: auto; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px var(--p-pad); }
    .dwin .d-foot .d-acts { padding: 0; justify-content: flex-end; }
    .dwin .d-grow { flex: 1; }
    .dwin .d-choice { padding: 6px var(--p-gap); margin: 4px 0; border: 1px solid var(--p-line); border-radius: var(--p-r2); cursor: pointer; }
    .dwin .d-choice.on { border-color: var(--p-accent); background: var(--p-accent-soft); }
    .dwin .d-choice.star { border-style: dashed; border-color: var(--p-gold); }
    .dwin .d-cards { display: flex; gap: 6px; flex-wrap: wrap; }
    .dwin .d-card { flex: 1 1 130px; padding: 6px var(--p-gap); border: 1px solid var(--p-line); border-radius: var(--p-r2); cursor: pointer; font-size: var(--p-fs-sub); }
    .dwin .d-card.on { border-color: var(--p-accent); background: var(--p-accent-soft); }
    .dwin input[type=text] { font: inherit; width: 120px; padding: 1px 6px; border: 1px solid var(--p-line); border-radius: var(--p-r2); background: var(--p-soft); color: inherit; }
    .dwin select { font: inherit; font-size: var(--p-fs-sub); padding: 1px 4px; border: 1px solid var(--p-line); border-radius: var(--p-r2); background: var(--p-bg); color: inherit; }
    .dwin { word-break: keep-all; overflow-wrap: anywhere; }
    .dwin button { font: inherit; font-size: var(--p-fs-sub); padding: 1px 8px; border: 1px solid var(--p-line); background: transparent; color: inherit; border-radius: var(--p-r2); cursor: pointer; }
    .dwin button:hover:not(:disabled):not(.on) { background: var(--p-soft); }
    .dwin button.on { background: var(--p-accent); border-color: var(--p-accent); color: var(--p-on); }
    .dwin button:disabled { opacity: .45; cursor: default; }
    .dwin .d-head { height: 32px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--p-pad); font-weight: bold; border-bottom: 1px solid var(--p-sep); }
    .dwin .d-tabs { height: 32px; flex: none; display: flex; }
    .dwin .d-tabs button { flex: 1; border-radius: 0; border-width: 0 0 2px; border-color: var(--p-sep); font-size: var(--p-fs); }
    .dwin .d-tabs button.on { background: transparent; color: inherit; border-color: var(--p-accent); font-weight: bold; }
    .dwin .d-body { flex: 1; overflow-y: auto; padding: var(--p-gap) var(--p-pad); }
    .dwin .d-foot { height: 32px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--p-pad); font-size: var(--p-fs-sub); opacity: .8; border-top: 1px solid var(--p-sep); }
    .dwin .d-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
    .dwin .d-group { margin-top: 8px; font-weight: bold; font-size: 12px; opacity: .75; }
    .dwin .d-row { padding: 2px 0; }
    .dwin .d-row.more { cursor: pointer; }
    .dwin .d-caret { float: right; opacity: .6; }
    .dwin .d-sub { padding: 0 0 2px 16px; font-size: 12px; line-height: 1.45; }
    .dwin .d-tag, .dwin .d-strong { font-weight: bold; }
    .dwin .d-strong { font-size: 13px; }
    .dwin .d-note { font-size: 12px; opacity: .8; line-height: 1.4; }
    .dwin .d-indent { padding-left: 16px; }
    .dwin .d-indent2 { padding-left: 32px; }
    .dwin .d-item { padding: 2px 0; }
    .dwin .d-col { flex: 1; min-width: 0; }
    .dwin .d-num { opacity: .75; }
    .dwin .d-off { opacity: .5; }
    .dwin .d-sum { padding: 2px 0 4px; }
    .dwin .d-dim { opacity: .65; font-size: 12px; }
    .dwin .d-sec { padding: var(--p-gap) 0; border-bottom: 1px solid var(--p-sep); }
    .dwin .d-cols { display: flex; gap: var(--p-pad); }
    .dwin .d-badge { font-size: var(--p-fs-sub); border: 1px solid var(--p-line); border-radius: var(--p-r2); padding: 0 5px; }
    .dwin .d-badge.neg { border-style: dashed; }
    .dwin .d-grade { font-weight: bold; }
    .dwin .d-acts { display: flex; gap: 6px; padding: 2px 0 6px 16px; }
    .dwin .d-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .dwin .d-label { flex: 0 0 auto; min-width: 110px; max-width: 190px; white-space: normal; } /* 긴 이름이 단추 뒤로 가리지 않게 줄을 바꾼다 */
    .dwin .d-seg { display: flex; gap: 2px; flex-wrap: wrap; }
    .dwin .d-confirm { margin: 4px 0 4px 16px; padding: var(--p-gap); border: 1px solid var(--p-warn); border-radius: var(--p-r2); }
    .dwin .d-tree { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 0; }
    .dwin .d-tree-node { border: 2px solid currentColor; border-radius: var(--p-r2); padding: 4px 10px; cursor: pointer; }
    .dwin .d-tree-node.dashed { border-style: dashed; }
    .dwin .d-tree-node.thin { border-width: 1px; opacity: .8; cursor: default; }
    .dwin .d-tree-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dwin .d-tree-link { padding-left: 20px; opacity: .6; line-height: 1; }
    .dwin progress { width: 120px; vertical-align: middle; }
    /* 데스크톱 투명 창(D85): 배경 투명, 판은 기본 창 위로 쌓는다(아래가 기본 창). 개발용 단추는 ?dev=1만 */
    html.desktop, html.desktop body { background: transparent; margin: 0; overflow: hidden; }
    html.desktop #app { display: inline-flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; padding: 6px; }
    html.desktop .dwin { margin-top: 0; max-height: var(--panel-max, 10000px); } /* 화면 위로 넘치지 않게(D85) */
    html.desktop #menu { position: static; align-self: flex-start; margin-top: 4px; }
    html:not(.dev) #controls, html:not(.dev) #info { display: none; }
    html.booting #stack, html.booting #controls, html.booting #info { display: none; } /* 첫 실행 창 동안 */
    html.through #stack { opacity: .8; } /* 클릭 통과 중 80%(03 §10) */
    html.hc #col, html.hc #strip { background: rgb(var(--paper)); }
    html.hc #art { filter: brightness(.6) saturate(.5); }
    html.hc #col, html.hc #strip { color: #000; }
    html.hc.dark #col, html.hc.dark #strip { color: #fff; }
    .dwin { zoom: var(--t, 1); } /* 글자 배율은 상세 창 등 판에도(03 §7) */
    #settings { width: 400px; height: 480px; }
    #settings .d-foot, #firstrun .d-foot, #summary .d-foot { height: auto; min-height: 32px; padding: 6px var(--p-pad); }
    #firstrun { width: 480px; height: 560px; }
    .dwin .d-preview { height: 110px; display: flex; align-items: center; justify-content: center; }
    .dwin .d-preview canvas { image-rendering: pixelated; }
    .dwin .d-hero { width: 48px; height: 48px; background: url(sprites/chr_actions18_48.png) 0 0; image-rendering: pixelated; transform: scale(2); animation: tap-idle .88s steps(4) infinite; }
    @keyframes tap-idle { to { background-position: -192px 0; } }
    .dwin .d-place { position: relative; height: 120px; margin: 8px 0; overflow: hidden; border: 1px solid var(--p-line); border-radius: var(--p-r2); background: var(--p-soft); }
    .dwin .d-place::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: rgba(128,128,128,.4); } /* 작업 표시줄 */
    .dwin .d-place-win { position: absolute; right: 8px; bottom: 16px; width: 96px; height: 16px; background: var(--p-accent); border-radius: 2px; }
    .dwin .d-bag-grid { display: grid; grid-template-columns: repeat(10, 20px); gap: 2px; margin: 4px 0 6px 16px; }
    .dwin .d-bag-cell { width: 20px; height: 20px; box-sizing: border-box; border: 1px dashed rgba(128,128,128,.5); font-size: 11px; line-height: 18px; text-align: center; }
    .dwin .d-bag-cell.full { border: 2px solid; }
    /* 서가(03 §5.5)·책 보기(03 §5.6) */
    .dwin .d-shelf { display: flex; gap: 4px; align-items: flex-end; min-height: 104px; padding-top: 8px; flex-wrap: wrap; }
    .dwin .d-spine { position: relative; width: 20px; height: 96px; box-sizing: border-box; border: 1px solid rgba(0,0,0,.4); border-radius: 2px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; padding-top: 4px; font-size: 12px; line-height: 12px; background: #8a6a4a; color: #fff; }
    .dwin .d-spine.mid { width: 24px; } .dwin .d-spine.thick { width: 28px; }
    .dwin .d-spine.died { background: #4a4a5a; } .dwin .d-spine.long_sleep { background: #3a4a6a; }
    .dwin .d-spine.unread::before { content: ''; position: absolute; top: -6px; left: 40%; width: 3px; height: 12px; background: #c9453a; } /* 책갈피 끈 */
    .dwin .d-spine.writing { border-style: dashed; background: transparent; color: inherit; opacity: .7; }
    .dwin .d-spine .d-emblem { height: 12px; margin-bottom: 4px; }
    .dwin .d-spine-name { writing-mode: vertical-rl; letter-spacing: 1px; }
    .dwin .d-shelf-board { height: 16px; background: #6b4f36; border-radius: 2px; }
    .dwin .d-shelf-head { min-height: 20px; }
    .dwin .d-book-head, .dwin .d-book-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; }
    .dwin .d-book-foot { justify-content: center; }
    .dwin .d-book-page { min-height: 360px; padding: 8px 0; font-size: 13px; line-height: 20px; word-break: keep-all; overflow-wrap: anywhere; }
    .dwin .d-book-line.gap { margin-top: 8px; } /* 블록 사이 8(03 §5.6) */
    .dwin .d-book-line.title { font-size: 18px; font-weight: bold; line-height: 28px; }
    .dwin .d-book-line.head { font-size: 15px; font-weight: bold; }
    .dwin .d-book-line.dim { opacity: .7; }
    .dwin .d-book-line.fork { border-left: 2px solid currentColor; padding-left: 8px; background: rgba(128,128,128,.1); }
    .dwin .d-book-line.letter { border-left: 1px solid rgba(128,128,128,.6); border-right: 1px solid rgba(128,128,128,.6); padding: 0 8px; }
    .dwin .d-book-line.quote { padding-left: 16px; font-style: italic; }
    .dwin .d-book-line.opener, .dwin .d-book-line.attitude { opacity: .85; }
    #controls { margin-top: 12px; display: flex; gap: 6px; }
    #info { margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
  <div id="stack">
    <div id="strip" aria-label="기록 띠" title="누르면 일지를 엽니다"></div>
    <div id="win" aria-label="텝 기본 창">
      <canvas id="art"></canvas>
      <div id="col"></div>
      <div id="grip" title="끌어서 창 너비를 바꿉니다"></div>
    </div>
    <div id="bubble" role="status" hidden></div>
  </div>
  <div id="controls"></div>
  <div id="info">불러오는 중…</div>
  <div id="detail" class="dwin" hidden role="dialog" aria-label="상세 창"></div>
  <div id="choice" class="dwin" hidden role="dialog" aria-label="운명 선택 창"></div>
  <div id="succession" class="dwin" hidden role="dialog" aria-label="계승 화면"></div>
  <div id="summary" class="dwin" hidden role="dialog" aria-label="자리를 비운 동안"></div>
  <div id="settings" class="dwin" hidden role="dialog" aria-label="설정"></div>
  <div id="firstrun" class="dwin" role="dialog" aria-label="처음 시작" hidden></div>
  </div>
  <div id="menu" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
